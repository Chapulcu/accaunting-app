services:
  supabase_db:
    image: supabase/postgres:15.1.0.117
    container_name: supabase_db_accounting-app
    ports:
      - "6544:5432"
    env_file:
      - .env.supabase
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - supabase-db:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  supabase_auth:
    image: supabase/gotrue:v2.143.0
    container_name: supabase_auth_accounting-app
    depends_on:
      supabase_db:
        condition: service_healthy
    env_file:
      - .env.supabase
    environment:
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@supabase_db:5432/${POSTGRES_DB}
      DB_NAMESPACE: auth
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    volumes:
      - ./supabase/gotrue-migrations/20221208132122_backfill_email_last_sign_in_at.up.sql:/usr/local/etc/auth/migrations/20221208132122_backfill_email_last_sign_in_at.up.sql:ro
    restart: unless-stopped

  supabase_rest:
    image: postgrest/postgrest:v12.0.2
    container_name: supabase_rest_accounting-app
    depends_on:
      supabase_db:
        condition: service_healthy
    env_file:
      - .env.supabase
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@supabase_db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

  supabase_realtime:
    image: supabase/realtime:v2.25.44
    container_name: supabase_realtime_accounting-app
    depends_on:
      supabase_db:
        condition: service_healthy
    env_file:
      - .env.supabase
    environment:
      DB_HOST: supabase_db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      PORT: "4000"
      JWT_SECRET: ${JWT_SECRET}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      FLY_APP_NAME: supabase-realtime
      RT_OPEN: "true"
    restart: unless-stopped

  supabase_storage:
    image: supabase/storage-api:v1.0.6
    container_name: supabase_storage_accounting-app
    depends_on:
      supabase_db:
        condition: service_healthy
      supabase_rest:
        condition: service_started
    env_file:
      - .env.supabase
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@supabase_db:5432/${POSTGRES_DB}
      POSTGREST_URL: http://supabase_rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
    volumes:
      - supabase-storage:/var/lib/storage
    restart: unless-stopped

  supabase_kong:
    image: kong:2.8.1
    container_name: supabase_kong_accounting-app
    depends_on:
      supabase_auth:
        condition: service_started
      supabase_rest:
        condition: service_started
      supabase_storage:
        condition: service_started
      supabase_realtime:
        condition: service_started
    ports:
      - "6543:8000"
    volumes:
      - ./supabase/kong.yml:/home/kong/kong.yml:ro
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports:
      - "8080:80"
    env_file:
      - .env
    depends_on:
      - supabase_kong
    restart: always

volumes:
  supabase-db:
  supabase-storage:
