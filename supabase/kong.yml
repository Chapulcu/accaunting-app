_format_version: "2.1"
_transform: true

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://localhost:8080
        - http://127.0.0.1:3000
        - http://127.0.0.1:8080
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - apikey
        - x-supabase-api-version
        - x-client-info
        - accept-profile
        - content-profile
        - prefer
      credentials: true

services:
  - name: auth
    url: http://supabase_auth:8081/
    routes:
      - name: auth
        strip_path: true
        paths:
          - /auth/v1
  - name: rest
    url: http://supabase_rest:3000/
    routes:
      - name: rest
        strip_path: true
        paths:
          - /rest/v1
  - name: storage
    url: http://supabase_storage:5000/
    routes:
      - name: storage
        strip_path: true
        paths:
          - /storage/v1
  - name: realtime
    url: http://supabase_realtime:4000/socket/
    routes:
      - name: realtime
        strip_path: true
        paths:
          - /realtime/v1
